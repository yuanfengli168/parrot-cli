[package]
name = "parrot-cli"
version = "0.1.0"
edition = "2021"
description = "A local-first, MCP-extensible CLI for post-meeting processing"
license = "MIT"

[[bin]]
name = "parrot-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"
dirs = "5"
which = "6"
indicatif = "0.17"
dialoguer = "0.11"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
regex = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
serial_test = "3"